name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      authorization_only:
        description: Check the existing npm trust bindings without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check existing npm authorization without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.authorization_only
        run: |
          node --test .github/scripts/check-npm-authorization.test.mjs
          node .github/scripts/check-npm-authorization.mjs
      - run: npm ci
        if: github.event_name != 'workflow_dispatch' || !inputs.authorization_only
      - name: Publish packages with npm trusted publishing
        if: github.event_name != 'workflow_dispatch' || !inputs.authorization_only
        run: npm run publish:all -- --provenance
